<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinamentos SST - NRs e certificados</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--ink:#0F1E2B;--muted:#566776;--line:#D3DAE1;--chip:#E3E8ED;
  --yellow:#F5B800;--blue:#1F5FA8;--red:#C4352B;
  --ok-bg:#DCF2E6;--ok-fg:#0E5A38;--warn-bg:#FFEFB8;--warn-fg:#654500;--bad-bg:#FADAD6;--bad-fg:#8A1F17;
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C151D;--surface:#15222D;--ink:#E8EEF3;--muted:#93A4B3;--line:#283A4B;--chip:#1E2F3E;
    --ok-bg:#12382A;--ok-fg:#8EE0B5;--warn-bg:#3F3208;--warn-fg:#F5D77A;--bad-bg:#431A17;--bad-fg:#F3A39B;
  }
}
:root[data-theme="dark"]{
  --bg:#0C151D;--surface:#15222D;--ink:#E8EEF3;--muted:#93A4B3;--line:#283A4B;--chip:#1E2F3E;
  --ok-bg:#12382A;--ok-fg:#8EE0B5;--warn-bg:#3F3208;--warn-fg:#F5D77A;--bad-bg:#431A17;--bad-fg:#F3A39B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.stripe{height:10px;background:repeating-linear-gradient(135deg,var(--yellow) 0 14px,#111 14px 28px)}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px}
.brand{font:700 26px/1 var(--f-head);letter-spacing:.2px}
.brand small{display:block;font:500 14px/1.3 var(--f-body);color:var(--muted);margin-top:3px}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1{font:700 30px/1.05 var(--f-head);margin:6px 0 4px}
h2{font:700 21px/1.1 var(--f-head);margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.meta{color:var(--muted);font-size:14px;margin:2px 0 0}
.note{font-size:14px;color:var(--muted);margin:10px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--yellow);color:#111;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn.big{width:100%;margin-top:14px;min-height:50px;font-size:17px}
.link{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer}
.back{background:none;border:0;color:var(--blue);padding:8px 0;min-height:44px;cursor:pointer;font-weight:500}

.inp,select{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);margin-top:4px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}

.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:64px}
.item b{display:block;font-weight:600;line-height:1.25}
.sign{flex:none;width:52px;height:52px;background:var(--yellow);color:#111;border:2.5px solid #111;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-head);line-height:.9}
.sign small{font-size:12px;font-weight:600;letter-spacing:.5px}
.sign b{font-size:25px;font-weight:700;display:block}
.sign.off{background:var(--chip);color:var(--muted);border-color:var(--muted)}
.head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.head .sign{width:62px;height:62px}
.head .sub{margin:0}

.aula{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.aula summary{list-style:none;cursor:pointer;padding:12px;display:flex;gap:10px;align-items:flex-start;font-weight:500;min-height:44px}
.aula summary::-webkit-details-marker{display:none}
.aula p{margin:0;padding:0 12px 12px 46px;color:var(--muted)}
.idx{flex:none;width:24px;height:24px;border-radius:50%;background:var(--chip);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}

.chk{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:52px}
.chk input{width:22px;height:22px;flex:none}
.chk span{display:block}
.chk small{display:block;color:var(--muted)}

.st{flex:none;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok-fg)}
.st.warn{background:var(--warn-bg);color:var(--warn-fg)}
.st.bad{background:var(--bad-bg);color:var(--bad-fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.logo-prev{max-height:60px;max-width:180px;display:block;margin:6px 0;background:#fff;border:1px solid var(--line);padding:4px;border-radius:6px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:56px;border:0;border-top:3px solid transparent;background:none;font-size:13px;color:var(--muted);cursor:pointer;padding:0 2px}
.tab[aria-current="page"]{border-top-color:var(--yellow);color:var(--ink);font-weight:600}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:var(--surface);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal-card h2{margin-top:0}
@media (min-width:600px){#modal{align-items:center}.modal-card{border-radius:14px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:90%;text-align:center;font-size:15px}

#cert-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 12px 24px}
.cert-bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 0;background:var(--bg)}
#cert-box{margin:0 auto}
#cert-scale{width:297mm;transform-origin:top left}

/* Certificado */
.cert-page{position:relative;width:297mm;height:210mm;background:#fff;color:#0F1E2B;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.3);margin:0 0 18px;font-family:var(--f-body)}
.c-band{position:absolute;left:0;right:0;top:0;height:7mm;background:repeating-linear-gradient(135deg,#F5B800 0 5mm,#111 5mm 10mm)}
.c-in{position:absolute;left:10mm;right:10mm;top:15mm;bottom:10mm;border:.6mm solid #0F1E2B;padding:7mm 14mm 6mm;display:flex;flex-direction:column}
.c-head{display:flex;align-items:center;gap:5mm;min-height:14mm}
.c-logo{max-height:14mm;max-width:40mm;object-fit:contain}
.c-head b{display:block;font-size:13pt}
.c-head span{font-size:9pt;color:#4a5a68}
.c-title{font:700 38pt/1 var(--f-head);margin:3mm 0 0;text-align:center}
.c-sub{text-align:center;font-size:12pt;color:#3a4a58;margin:1mm 0 5mm}
.c-txt{text-align:center;font-size:13pt;margin:0 0 2mm;line-height:1.5}
.c-name{text-align:center;font:600 30pt/1.1 var(--f-head);margin:0 0 2mm;border-bottom:.3mm solid #0F1E2B;padding:0 8mm 1mm;align-self:center;min-width:60%}
.c-val{text-align:center;font-size:11pt;color:#3a4a58;margin:2mm 0 0}
.c-sign{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:auto;padding:0 8mm}
.c-sign div{border-top:.3mm solid #0F1E2B;padding-top:1.5mm;text-align:center;font-size:10pt;line-height:1.3}
.c-sign b{display:block;font-size:11pt}
.c-foot{display:flex;justify-content:space-between;font-size:9pt;color:#4a5a68;margin-top:5mm}
.c-vt{font:700 26pt/1 var(--f-head);margin:2mm 0 1mm}
.c-list{columns:2;column-gap:12mm;margin:4mm 0 0;padding-left:6mm;font-size:11pt;line-height:1.45}
.c-list li{break-inside:avoid;margin-bottom:1.5mm}
.c-meta{margin-top:auto;font-size:10pt;line-height:1.5;border-top:.3mm solid #0F1E2B;padding-top:3mm}

@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff!important;overflow:visible!important;height:auto!important}
  :root{padding:0!important}
  #app,nav,#modal,#toast,.no-print,.stripe{display:none!important}
  #cert-overlay{position:static!important;overflow:visible!important;padding:0!important;background:#fff!important;inset:auto!important}
  #cert-box{width:auto!important;height:auto!important;margin:0!important}
  #cert-scale{transform:none!important}
  .cert-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
}
</style>
</head>
<body>
<div id="app">
  <div class="stripe"></div>
  <header class="top"><div class="top-in"><div class="brand">Treinamentos SST<small>NRs, aulas e certificados</small></div></div></header>
  <main id="view"></main>
  <nav aria-label="Principal"><div class="tabs">
    <button class="tab" data-a="tab" data-t="cursos">Cursos</button>
    <button class="tab" data-a="tab" data-t="alunos">Alunos</button>
    <button class="tab" data-a="tab" data-t="emitir">Emitir</button>
    <button class="tab" data-a="tab" data-t="certs">Certificados</button>
    <button class="tab" data-a="tab" data-t="ajustes">Ajustes</button>
  </div></nav>
</div>
<div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="cert-overlay" hidden>
  <div class="cert-bar no-print">
    <button class="btn" data-a="print">Imprimir ou salvar PDF</button>
    <button class="btn ghost" data-a="cert-x">Fechar</button>
  </div>
  <div id="cert-box"><div id="cert-scale"></div></div>
</div>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ Dados: NRs, treinamentos e aulas ============

   a: aulas [título, resumo]
   Os valores são de referência e podem ser editados no app. */
const NRS=[
{n:1,nome:'Disposições Gerais e Gerenciamento de Riscos Ocupacionais',t:[['Integração e treinamento admissional em SST',8,null]],a:[
['Objetivo e campo de aplicação','Como as Normas Regulamentadoras se organizam e a quem se aplicam.'],
['Direitos e deveres','Responsabilidades do empregador e do trabalhador, incluindo o direito de recusa diante de risco grave e iminente.'],

['Programa de Gerenciamento de Riscos (PGR)','Inventário de riscos e plano de ação como base das medidas de controle.'],
['Capacitação e treinamentos','Quando o treinamento é exigido, conteúdo, carga horária e registro em certificado.'],

{n:2,nome:'Inspeção Prévia',r:1,t:[],a:[]},
{n:3,nome:'Embargo e Interdição',t:[],a:[
['Conceitos de embargo e interdição','Diferença entre paralisar uma obra e paralisar setor, máquina ou equipamento.'],
['Quando se aplica','Situações de grave e iminente risco constatadas pela inspeção do trabalho.'],
['Levantamento da medida','Providências para liberar a atividade após a correção das irregularidades.']]},
{n:4,nome:'Serviços Especializados em Segurança e em Medicina do Trabalho (SESMT)',t:[],a:[
['Finalidade do SESMT','Promover a saúde e proteger a integridade do trabalhador no ambiente de trabalho.'],
['Composição e dimensionamento','Relação entre grau de risco, número de empregados e profissionais exigidos.'],
['Atribuições dos profissionais','Atuação do técnico, do engenheiro, do médico e do enfermeiro do trabalho.'],
['SESMT comum e regionalizado','Possibilidade de serviços compartilhados entre empresas.']]},
{n:5,nome:'Comissão Interna de Prevenção de Acidentes e de Assédio (CIPA)',t:[['Treinamento de membros da CIPA',20,12],['Treinamento de designado da CIPA',8,null]],a:[

['Processo eleitoral e mandato','Etapas da eleição, posse e duração do mandato.'],

{n:6,nome:'Equipamento de Proteção Individual (EPI)',t:[['Uso, guarda e conservação de EPI',2,null]],a:[

['Certificado de Aprovação (CA)','Como verificar o CA e a validade do equipamento.'],
['Responsabilidades','Deveres do empregador (fornecer, orientar, substituir) e do trabalhador (usar e conservar).'],

['Guarda, inspeção e substituição','Armazenamento, sinais de desgaste e registro de entrega.']]},
{n:7,nome:'Programa de Controle Médico de Saúde Ocupacional (PCMSO)',t:[],a:[
['Objetivo do PCMSO','Promoção e preservação da saúde do conjunto de trabalhadores, integrado ao PGR.'],
['Exames médicos ocupacionais','Admissional, periódico, de retorno ao trabalho, de mudança de risco e demissional.'],
['Atestado de Saúde Ocupacional (ASO)','Conteúdo, emissão e arquivamento.'],
['Relatório analítico','Análise dos resultados e ações de saúde decorrentes.'],
['Primeiros socorros','Preparo para o atendimento inicial a acidentes e mal súbito.']]},
{n:8,nome:'Edificações',t:[],a:[

['Proteção contra intempéries e iluminação','Conforto e segurança nos locais de trabalho.']]},
{n:9,nome:'Avaliação e Controle das Exposições Ocupacionais a Agentes Físicos, Químicos e Biológicos',t:[['Informação sobre exposições ocupacionais',4,null]],a:[

['Reconhecimento e avaliação','Como as exposições são reconhecidas e quantificadas.'],
['Medidas de prevenção e controle','Eliminação, redução na fonte, medidas coletivas e EPI.'],
['Relação com o PGR','Registro das avaliações no inventário de riscos.']]},
{n:10,nome:'Segurança em Instalações e Serviços em Eletricidade',t:[['NR-10 Básico',40,24],['NR-10 Complementar - SEP (Sistema Elétrico de Potência)',40,24]],a:[

['Técnicas de análise de risco','Identificação e avaliação dos riscos antes de intervir.'],
['Medidas de controle do risco elétrico','Desenergização, aterramento, bloqueio e etiquetagem, isolação.'],
['Normas técnicas e regulamentações','Normas aplicáveis às instalações e aos serviços.'],
['Equipamentos de proteção coletiva e individual','Seleção, inspeção e uso.'],
['Rotinas de trabalho e procedimentos','Ordem de serviço, permissão de trabalho e procedimentos padronizados.'],
['Documentação das instalações elétricas','Prontuário, diagramas e registros.'],
['Proteção e combate a incêndios','Riscos de incêndio em instalações elétricas e uso de extintores.'],
['Acidentes de origem elétrica e primeiros socorros','Condutas de emergência e resgate.']]},
{n:11,nome:'Transporte, Movimentação, Armazenagem e Manuseio de Materiais',t:[['Operador de empilhadeira e equipamentos de movimentação',16,null]],a:[

['Operação segura','Capacidade de carga, velocidade, rampas e visibilidade.'],

['Movimentação manual de cargas','Postura e limites de esforço.']]},
{n:12,nome:'Segurança no Trabalho em Máquinas e Equipamentos',t:[['Capacitação para operação segura de máquinas e equipamentos',8,null]],a:[
['Princípios gerais e responsabilidades','Quem responde pela segurança de máquinas e equipamentos.'],
['Proteções e dispositivos de segurança','Proteções fixas e móveis, intertravamentos e cortinas de luz.'],
['Dispositivos de parada de emergência','Função, localização e teste.'],
['Bloqueio e sinalização na manutenção','Impedir o acionamento acidental durante intervenções.'],

['Dispositivos de segurança','Válvulas de segurança, manômetros e instrumentos de controle.'],

['Inspeção e manutenção','Inspeções periódicas e registros.'],
['Prontuário e documentação','Documentos que acompanham o equipamento.'],
['Situações de emergência','Condutas diante de falhas e vazamentos.']]},
{n:14,nome:'Fornos',t:[],a:[
['Instalação e construção de fornos','Requisitos de projeto e isolamento térmico.'],
['Operação e manutenção','Procedimentos seguros e controle de temperatura.'],
['Riscos e proteções','Queimaduras, gases e medidas de proteção.']]},
{n:15,nome:'Atividades e Operações Insalubres',t:[],a:[

{n:16,nome:'Atividades e Operações Perigosas',t:[],a:[

{n:17,nome:'Ergonomia',t:[['Ergonomia: orientação aos trabalhadores',4,null]],a:[

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TIPOS={inicial:'Formação inicial',reciclagem:'Reciclagem',periodico:'Treinamento periódico'};
function isoHoje(){const t=new Date();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`}
function fmt(d){return d?d.split('-').reverse().join('/'):''}
function fmtLong(d){if(!d)return '';const [y,m,da]=d.split('-').map(Number);return `${da} de ${MESES[m-1]} de ${y}`}
function addMonths(iso,m){const [y,mo,da]=iso.split('-').map(Number);const dt=new Date(y,mo-1+m,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(da,last));return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function diasAte(iso){const [y,m,d]=iso.split('-').map(Number);const t=new Date();const h=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((new Date(y,m-1,d)-h)/86400000)}
function maskCPF(v){const d=v.replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3500)}

  perfil(){return dbRun(sb.from('perfis').upsert({user_id:meuId(),cfg:S.cfg,over:S.over,updated_at:new Date().toISOString()},{onConflict:'user_id'}))},
  aluno(a){return dbRun(sb.from('alunos').upsert({user_id:meuId(),id:a.id,dados:a},CONF))},
  alunos(l){return l.length?dbRun(sb.from('alunos').upsert(l.map(a=>({user_id:meuId(),id:a.id,dados:a})),CONF)):Promise.resolve(true)},
  alunoDel(id){return dbRun(sb.from('alunos').delete().eq('id',id))},
  certs(l){return l.length?dbRun(sb.from('certificados').upsert(l.map(c=>({user_id:meuId(),id:c.id,dados:c,validade:c.validade||null})),CONF)):Promise.resolve(true)},

};
async function loadCloud(){
  const [p,a,c]=await Promise.all([
    sb.from('perfis').select('cfg,over').maybeSingle(),
    sb.from('alunos').select('dados').order('created_at'),
    sb.from('certificados').select('dados').order('created_at',{ascending:false})
  ]);
  const err=p.error||a.error||c.error;if(err)throw err;
  merge({cfg:p.data&&p.data.cfg,over:p.data&&p.data.over,alunos:(a.data||[]).map(r=>r.dados),certs:(c.data||[]).map(r=>r.dados)});
}
async function pushAll(){await P.perfil();await P.alunos(S.alunos);await P.certs(S.certs)}
async function unir(o){
  const b=VAZIO();const ai=new Set(S.alunos.map(a=>a.id)),ci=new Set(S.certs.map(c=>c.id));
  (o.alunos||[]).forEach(a=>{if(a&&a.id&&!ai.has(a.id))S.alunos.push(a)});
  (o.certs||[]).forEach(c=>{if(c&&c.id&&!ci.has(c.id))S.certs.push(c)});
  const vazio=!S.cfg.empresa&&!S.cfg.inst.nome&&!S.cfg.rt.nome;
  if(vazio&&o.cfg){const c=o.cfg;S.cfg={...b.cfg,...c,inst:{...b.cfg.inst,...(c.inst||{})},rt:{...b.cfg.rt,...(c.rt||{})}}}
  if(o.over&&typeof o.over==='object'&&!Object.keys(S.over).length)S.over=o.over;
  await pushAll();render();
}

}

function certStatus(c){
  if(!c.validade)return {k:'none',txt:'Sem validade'};
  const d=diasAte(c.validade);
  if(d<0)return {k:'bad',txt:'Vencido'};
  if(d<=60)return {k:'warn',txt:d===0?'Vence hoje':`Vence em ${d} dia${d>1?'s':''}`};
  return {k:'ok',txt:'Válido'};
}
function certsView(){
  const cnt={ok:0,warn:0,bad:0,none:0};S.certs.forEach(c=>cnt[certStatus(c).k]++);
  const F=[['todos','Todos',S.certs.length],['ok','Válidos',cnt.ok],['warn','Vencendo',cnt.warn],['bad','Vencidos',cnt.bad]];
  return `<h1>Certificados emitidos</h1><p class="sub">Acompanhe validades e reimprima quando precisar.</p>
  <div class="chips">${F.map(([k,l,n])=>`<button class="chip" data-a="filtro" data-f="${k}" aria-pressed="${U.cf===k}">${l} (${n})</button>`).join('')}</div>

}

}

function openCerts(ids){
  const list=ids.map(id=>S.certs.find(c=>c.id===id)).filter(Boolean);
  $('#cert-scale').innerHTML=list.map(certPages).join('');
  $('#cert-overlay').hidden=false;document.body.style.overflow='hidden';
  $('#cert-overlay').scrollTop=0;fit();
}
function fit(){
  const o=$('#cert-overlay');if(o.hidden)return;
  const w=297*96/25.4;const sc=Math.min(1,(window.innerWidth-24)/w);
  const s=$('#cert-scale'),b=$('#cert-box');
  s.style.transform=`scale(${sc})`;
  b.style.width=(w*sc)+'px';b.style.height=(s.offsetHeight*sc)+'px';
}
window.addEventListener('resize',fit);

function readEmit(){
  const e=U.emit;if(!$('#e-nr'))return;
  e.nr=+$('#e-nr').value;const ti=$('#e-ti');if(ti)e.ti=+ti.value;
  e.tipo=$('#e-tipo').value;e.horas=$('#e-h').value;e.local=$('#e-loc').value;
  e.ini=$('#e-ini').value;e.fim=$('#e-fim').value;
  e.sel=[...document.querySelectorAll('[data-sel]:checked')].map(x=>x.dataset.sel);
}
const A={
  tab(el){const t=el.dataset.t;if(t==='cursos'&&U.tab==='cursos')U.nr=null;if(U.tab==='emitir')readEmit();U.tab=t;render();scrollTo(0,0)},
  abrir(el){U.tab='cursos';U.nr=+el.dataset.n;render();scrollTo(0,0)},
  voltar(){U.nr=null;render();scrollTo(0,0)},
  'emitir-de'(el){const n=+el.dataset.n,i=+el.dataset.i;const t=trains(getNR(n))[i];Object.assign(U.emit,{nr:n,ti:i,tipo:'inicial',horas:t&&t.horas?t.horas:'',ini:'',fim:'',sel:[]});U.tab='emitir';render();scrollTo(0,0)},
  'edit-t'(el){modalT(+el.dataset.n,+el.dataset.i)},
  'novo-t'(el){modalT(+el.dataset.n,null)},
  'mt-save'(el){
    const n=+el.dataset.n,i=el.dataset.i===''?null:+el.dataset.i;
    const nome=$('#mt-nome').value.trim();if(!nome)return toast('Informe o nome do treinamento.');
    const h=parseFloat($('#mt-h').value),v=parseInt($('#mt-v').value,10);
    const list=trains(getNR(n)).map(x=>({...x}));const o={nome,horas:h>0?h:null,val:v>0?v:null};
    if(i==null)list.push(o);else list[i]=o;
    S.over[n]=list;P.perfil();closeModal();render();
  },
  'mt-del'(el){const n=+el.dataset.n,i=+el.dataset.i;const list=trains(getNR(n)).map(x=>({...x}));list.splice(i,1);S.over[n]=list;P.perfil();closeModal();render()},
  'mt-reset'(el){delete S.over[+el.dataset.n];P.perfil();closeModal();render()},
  'modal-x'(){closeModal()},
  'au-mode'(el){const e=$('#au-email');if(e)U_AUTH.email=e.value.trim();U_AUTH.modo=el.dataset.m;showAuth()},
  async 'au-go'(){
    const a=U_AUTH;const s=$('#au-senha')?$('#au-senha').value:'';const eEl=$('#au-email');if(eEl)a.email=eEl.value.trim();
    const base=location.href.split('#')[0].split('?')[0];
    try{
      if(a.recov){
        if(s.length<8)return toast('Use pelo menos 8 caracteres na nova senha.');
        const r=await sb.auth.updateUser({password:s});if(r.error)throw r.error;
        a.recov=false;toast('Senha alterada.');await entrar();return;
      }
      if(!a.email)return toast('Informe o e-mail.');
      if(a.modo==='esqueci'){
        const r=await sb.auth.resetPasswordForEmail(a.email,{redirectTo:base});if(r.error)throw r.error;
        toast('Se o e-mail tiver conta, o link de recuperação foi enviado.');a.modo='entrar';showAuth();return;
      }
      if(!s)return toast('Informe a senha.');
      if(a.modo==='criar'){
        if(s.length<8)return toast('Use pelo menos 8 caracteres na senha.');
        const r=await sb.auth.signUp({email:a.email,password:s,options:{emailRedirectTo:base}});if(r.error)throw r.error;
        if(r.data&&r.data.session){SESS=r.data.session;await entrar();return}
        toast('Conta criada. Confirme o e-mail pelo link enviado e depois entre.');a.modo='entrar';showAuth();return;
      }
      const r=await sb.auth.signInWithPassword({email:a.email,password:s});if(r.error)throw r.error;
      SESS=r.data.session;await entrar();
    }catch(e){console.error(e);toast(msgAuth(e))}
  },
  async logout(){try{await sb.auth.signOut()}catch(e){}SESS=null;S=VAZIO();showAuth()},
  retry(){entrar()},
  async migrar(){
    const o=dadosLocais();if(!o)return toast('Não há dados antigos neste navegador.');
    await unir(o);toast('Dados deste navegador enviados para a sua conta.');
  },
  'a-save'(){
    const nome=$('#a-nome').value.trim();if(!nome)return toast('Informe o nome do aluno.');

  },

  'emitir-go'(){
    readEmit();const e=U.emit;const nr=getNR(e.nr),t=trains(nr)[e.ti];
    if(!t)return toast('Escolha um treinamento. Se a NR não tem nenhum, cadastre em Cursos.');
    if(!e.sel.length)return toast('Marque ao menos um aluno.');
    const horas=parseFloat(e.horas);if(!(horas>0))return toast('Informe a carga horária.');
    if(!e.ini||!e.fim)return toast('Informe as datas de início e término.');
    if(e.fim<e.ini)return toast('A data de término é anterior ao início.');
    const local=(e.local||S.cfg.local||'').trim();if(!local)return toast('Informe o local de realização.');
    if(!S.cfg.inst.nome||!S.cfg.rt.nome){toast('Cadastre o instrutor e o responsável técnico em Ajustes.');return}
    const val=t.val?addMonths(e.fim,t.val):'';
    const novos=e.sel.map(id=>S.alunos.find(a=>a.id===id)).filter(Boolean).map(a=>({
      id:uid(),codigo:'SST-'+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase(),
      aluno:a.nome,cpf:a.cpf,funcao:a.funcao,nr:nr.n,nrLabel:'NR-'+nr.n,nomeNR:nr.nome,trein:t.nome,tipo:e.tipo,horas,
      ini:e.ini,fim:e.fim,local,validade:val,emissao:isoHoje(),aulas:nr.a.map(x=>x[0]),
      emp:{nome:S.cfg.empresa,cnpj:S.cfg.cnpj,cidade:S.cfg.cidade},inst:{...S.cfg.inst},rt:{...S.cfg.rt}
    }));
    S.certs.unshift(...novos);P.certs(novos);openCerts(novos.map(c=>c.id));
  },
  filtro(el){U.cf=el.dataset.f;render()},
  'c-ver'(el){openCerts([el.dataset.id])},
  'c-del'(el){if(!confirm('Excluir este certificado?'))return;S.certs=S.certs.filter(c=>c.id!==el.dataset.id);P.certDel(el.dataset.id);render()},
  print(){window.print()},
  'cert-x'(){$('#cert-overlay').hidden=true;document.body.style.overflow='';if(U.tab==='emitir'){U.emit.sel=[];U.tab='certs'}render()},
  'cfg-save'(){
    const v=id=>$(id).value.trim();
    Object.assign(S.cfg,{empresa:v('#c-emp'),cnpj:v('#c-cnpj'),cidade:v('#c-cid'),local:v('#c-loc')});
    S.cfg.inst={nome:v('#c-in'),qual:v('#c-iq'),reg:v('#c-ir')};
    S.cfg.rt={nome:v('#c-rn'),qual:v('#c-rq'),reg:v('#c-rr')};
    P.perfil().then(ok=>{if(ok)toast('Ajustes salvos.')});
  },
  'logo-rm'(){S.cfg.logo='';P.perfil();render()},
  async export(){
    const txt=JSON.stringify(S);
    try{
      const dl=typeof claude!=='undefined'?await claude.use('downloads'):null;
      if(dl){await dl.save({filename:'backup-treinamentos-sst.json',data:txt});return}
      const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');
      a.href=URL.createObjectURL(b);a.download='backup-treinamentos-sst.json';document.body.appendChild(a);a.click();a.remove();
    }catch(x){if(!x||x.code!=='declined')toast('Não foi possível exportar o backup.')}
  },
  'import-btn'(){$('#import-file').click()},
  async wipe(){
    if(!confirm('Apagar todos os alunos, certificados e ajustes da sua conta? Esta ação não pode ser desfeita.'))return;
    const id=meuId();
    const ok=await dbRun(Promise.all([sb.from('alunos').delete().eq('user_id',id),sb.from('certificados').delete().eq('user_id',id),sb.from('perfis').delete().eq('user_id',id)]).then(rs=>{const e=rs.find(r=>r.error);return e||{}}));
    if(ok){S=VAZIO();render();toast('Dados apagados.')}
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ch==='e-nr'){readEmit();U.emit.ti=0;const x=trains(getNR(U.emit.nr))[0];U.emit.horas=x&&x.horas?x.horas:'';render()}
  else if(t.dataset.ch==='e-ti'){readEmit();const x=trains(getNR(U.emit.nr))[U.emit.ti];U.emit.horas=x&&x.horas?x.horas:'';render()}
  else if(t.dataset.ch==='e-data'){readEmit();$('#e-val').textContent=valPrev()}
  else if(t.id==='logo-file'&&t.files[0])lerLogo(t.files[0]);
  else if(t.id==='import-file'&&t.files[0])importar(t.files[0]);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='busca'){U.q=t.value;$('#lista').innerHTML=listaHTML()}
  else if(t.id==='cbusca'){U.cq=t.value;$('#clista').innerHTML=certsLista()}
  else if(t.id==='a-cpf')t.value=maskCPF(t.value);
});
function lerLogo(file){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const m=Math.min(1,500/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.cfg.logo=c.toDataURL('image/png');P.perfil();render();
  };img.onerror=()=>toast('Não foi possível ler essa imagem.');img.src=r.result};
  r.readAsDataURL(file);
}
function importar(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||(!o.alunos&&!o.certs&&!o.cfg))throw 0;unir(o).then(()=>toast('Backup importado.'))}catch(x){toast('Arquivo de backup inválido.')}};
  r.readAsText(file);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id&&e.target.id.startsWith('au-')){e.preventDefault();A['au-go']()}});
boot();
</script>
</body>
</html>
